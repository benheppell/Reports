<a class="back" href="../index.html">← All London reports</a>
<h1>Aqua London — Daily Covers &amp; Bookings</h1>
<div class="sub" id="sub">covers by booking-created date · Europe/London</div>
<div class="ctl">
  <label for="dpick">Reporting day</label>
  <input type="date" id="dpick">
  <button id="prev" type="button">← previous</button>
  <button id="next" type="button">next →</button>
  <button id="latest" type="button">latest</button>
  <span id="freshness"></span>
</div>
<div id="app"><div class="load">Loading live figures…</div></div>

<script>
/* Aqua London daily report — renders live from /.netlify/functions/london-daily.
   This file is the single source of truth for the baselines, bands, runs and alert
   statuses. The former builder _tools/daily_gen.py is retired: it produced the same
   page from a payload committed to git each morning, which is why the report went
   stale whenever the morning push was blocked.

   Definitions are locked and match _tools/covers_gen.py:
     Covers  = SUM(covers) by booking-created date, Europe/London, is_deleted false,
               status_simple <> 'Canceled', seating area not ILIKE '%bar%'.
     Website = Booking Widget + landing pages + Nav/Hero CTA + Menu Page + PPC + campaign tags.
     Staff-name booking sources are excluded from covers entirely, never bucketed.
   Alerts run on Website covers, NOT raw 'Booking Widget'. Aqua Shard re-tagged its widget
   traffic into named landing pages on 21 Aug 2026, so that series has a definition break.
   Walk-ins are shown but never alerted on: footfall, not a channel we run. */

const BAND = 0.20, MIX_PP = 10.0, SCALE = 50.0;
const INK = '#2563eb', ALERT = '#dc2626', GRID = '#94a3b8', BANDFILL = '#eef2f7', SURF = '#ffffff';
const SERIES = [['covers', 'Covers'], ['web', 'Website'], ['bookings', 'GA4 bookings']];
const SHORT = { 'Covers': 'covers', 'Website': 'website', 'GA4 bookings': 'GA4 bookings' };
const LABEL = { green: 'GREEN', blue: 'WATCH', amber: 'AMBER', red: 'RED', na: 'NO DATA' };
const RANK = { green: 0, na: 0, blue: 1, amber: 2, red: 3 };
const ALERTING = new Set(['amber', 'red']);
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

/* Python's format() rounds half to even. Match it so the live page shows the same
   figures the builder did for baselines like 1380.5. */
function bround(x) {
  if (x === null || x === undefined || !isFinite(x)) return x;
  const f = Math.floor(x), diff = x - f;
  if (Math.abs(diff - 0.5) < 1e-9) return (f % 2 === 0) ? f : f + 1;
  return Math.round(x);
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const grp = n => Math.trunc(n).toLocaleString('en-GB');
const fmt = x => (x === null || x === undefined) ? '–' : grp(bround(x));
const pctOf = (c, b) => (!b) ? null : (c - b) / b * 100.0;
const signed = p => (p >= 0 ? '+' : '') + bround(p);

function dparts(iso) { const t = new Date(iso + 'T00:00:00Z'); return t; }
function dlabel(iso) { const t = dparts(iso); return `${DOW[t.getUTCDay()]} ${String(t.getUTCDate()).padStart(2, '0')} ${MON[t.getUTCMonth()]}`; }
function longDate(iso) { const t = dparts(iso); return `${t.getUTCDate()} ${MON[t.getUTCMonth()]} ${t.getUTCFullYear()}`; }
function shiftDay(iso, n) { const t = dparts(iso); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); }

function median(xs) {
  if (!xs.length) return null;
  const s = [...xs].sort((a, b) => a - b), n = s.length;
  return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
}
function baseline(v, i) {
  const xs = [];
  for (const k of [7, 14, 21, 28]) if (i - k >= 0) xs.push(v[i - k]);
  return xs.length ? median(xs) : null;
}
function below(val, base) { return base !== null && base > 0 && val < base * (1 - BAND); }

/* Longest current run of below-band days ending on the reporting day, plus status. */
function assess(v, name, suppSet, D, N, available) {
  if (!available) return { series: name, run: 0, cliff: false, status: 'na', value: null, base: null, floor: null };
  let run = 0;
  for (let i = N - 1; i > N - 8; i--) {
    if (i < 0) break;
    if (suppSet.has(D[i]) || !below(v[i], baseline(v, i))) break;
    run++;
  }
  const b = baseline(v, N - 1);
  const cliff = b !== null && b > 0 && v[N - 1] < b * 0.5 && !suppSet.has(D[N - 1]);
  const status = (run >= 3 || cliff) ? 'red' : (run === 2 ? 'amber' : (run === 1 ? 'blue' : 'green'));
  return { series: name, run, cliff, status, value: v[N - 1], base: b, floor: b ? b * (1 - BAND) : null };
}

/* Website share more than 10pp under its own weekday baseline share, 2 days running. */
function mixAlert(vn, suppSet, D, N) {
  const share = [];
  for (let i = 0; i < N; i++) share.push(vn.covers[i] ? vn.web[i] / vn.covers[i] * 100.0 : null);
  const basesh = i => {
    const xs = [];
    for (const k of [7, 14, 21, 28]) if (i - k >= 0 && share[i - k] !== null) xs.push(share[i - k]);
    return xs.length ? median(xs) : null;
  };
  let run = 0;
  for (let i = N - 1; i > N - 8; i--) {
    if (i < 0) break;
    const bs = basesh(i);
    if (suppSet.has(D[i]) || share[i] === null || bs === null || share[i] >= bs - MIX_PP) break;
    run++;
  }
  return { run, share: share[N - 1], base: basesh(N - 1), status: run >= 2 ? 'amber' : (run === 1 ? 'blue' : 'green') };
}

function chip(p) {
  if (p === null) return '<span class="d na">n/a</span>';
  const cls = Math.abs(p) < 5 ? 'flat' : (p > 0 ? 'up' : 'down');
  return `<span class="d ${cls}">${signed(p)}%</span>`;
}
function alertchip(s, txt) { return `<span class="chip c-${s}">${txt || LABEL[s]}</span>`; }
function vchip(cur, base) {
  const p = pctOf(cur, base);
  if (p === null) return '<span class="v na">n/a</span>';
  const cls = Math.abs(p) < 5 ? 'flat' : (p > 0 ? 'up' : 'down');
  return `<span class="v ${cls}">${signed(p)}%</span>`;
}
function numcell(cur, base, lead) {
  return `<td class="n"><span class="big${lead ? ' lead' : ''}">${grp(cur)}</span>${vchip(cur, base)}<div class="bl">vs ${fmt(base)}</div></td>`;
}

/* 7 days plotted as variance against the weekday baseline, so the ±20% band is a constant
   ribbon and every chart on the page reads on the same scale. Hand-rolled SVG, no CDN. */
function spark(vals, title, D, N, RD) {
  const idx = []; for (let i = N - 7; i < N; i++) idx.push(i);
  const vs = idx.map(i => vals[i]);
  const bs = idx.map(i => baseline(vals, i) || 0);
  const dev = vs.map((v, k) => bs[k] ? (v - bs[k]) / bs[k] * 100.0 : 0.0);
  const W = 204.0, H = 92.0, PL = 4.0, PR = 34.0, PT = 9.0, PB = 14.0;
  const MIDY = PT + (H - PT - PB) / 2.0, HALF = (H - PT - PB) / 2.0;
  const X = k => PL + k * (W - PL - PR) / 6.0;
  const Y = d => MIDY - Math.max(-SCALE, Math.min(SCALE, d)) / SCALE * HALF;
  const bandtop = Y(BAND * 100), bandbot = Y(-BAND * 100);
  const grid = `<rect x="${(PL - 3).toFixed(1)}" y="${bandtop.toFixed(1)}" width="${(W - PL - PR + 6).toFixed(1)}" height="${(bandbot - bandtop).toFixed(1)}" fill="${BANDFILL}" rx="3"/>`
    + `<line x1="${(PL - 3).toFixed(1)}" y1="${MIDY.toFixed(1)}" x2="${(W - PR + 3).toFixed(1)}" y2="${MIDY.toFixed(1)}" stroke="${GRID}" stroke-width="1"/>`;
  const line = dev.map((d, k) => `${X(k).toFixed(1)},${Y(d).toFixed(1)}`).join(' ');
  let marks = '';
  dev.forEach((d, k) => {
    const bad = below(vs[k], bs[k] || null), last = (k === 6), off = Math.abs(d) > SCALE;
    const r = last ? 3.4 : 2.5, fillc = bad ? ALERT : INK;
    marks += `<g><title>${dlabel(D[idx[k]])} · ${title} ${grp(vs[k])} · baseline ${fmt(bs[k])} · ${signed(d)}% · band ${fmt(bs[k] * 0.8)} to ${fmt(bs[k] * 1.2)}${bad ? ' · BELOW BAND' : ''}${off ? ' · off scale' : ''}</title>`
      + `<circle cx="${X(k).toFixed(1)}" cy="${Y(d).toFixed(1)}" r="${(r + 1.7).toFixed(1)}" fill="${SURF}"/>`
      + `<circle cx="${X(k).toFixed(1)}" cy="${Y(d).toFixed(1)}" r="${r.toFixed(1)}" `
      + (off ? `fill="${SURF}" stroke="${fillc}" stroke-width="1.8"/>` : `fill="${fillc}"/>`)
      + `<rect x="${(X(k) - 17).toFixed(1)}" y="0" width="34" height="${(H - PB).toFixed(0)}" fill="transparent"/></g>`;
  });
  const endc = below(vs[6], bs[6] || null) ? ALERT : '#334155';
  const endlab = `<text x="${(X(6) + 7).toFixed(1)}" y="${(Y(dev[6]) - 1).toFixed(1)}" font-size="10" font-weight="700" fill="${endc}" font-family="JetBrains Mono,monospace">${grp(vs[6])}</text>`
    + `<text x="${(X(6) + 7).toFixed(1)}" y="${(Y(dev[6]) + 9).toFixed(1)}" font-size="8.5" fill="#94a3b8" font-family="JetBrains Mono,monospace">${signed(dev[6])}%</text>`;
  const labs = idx.map((i, k) => `<text x="${X(k).toFixed(1)}" y="${(H - 4).toFixed(0)}" text-anchor="middle" font-size="7.5" fill="#a8b3c2" font-family="JetBrains Mono,monospace">${D[i].slice(8, 10)}</text>`).join('');
  return `<svg viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}" role="img" aria-label="${title}, seven days to ${RD}, variance against weekday baseline">${grid}<polyline points="${line}" fill="none" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>${marks}${endlab}${labs}</svg>`;
}

const MIX = [['web', 'Website', '#2563eb'], ['walk', 'Walk-in', '#ea580c'],
             ['gr', 'Google Reserve', '#0d9488'], ['ot', 'OpenTable', '#8b5cf6'],
             ['rest', 'Reception / third party', '#cbd5e1']];
const MIXNAME = { gr: 'Google Reserve', ot: 'OpenTable', rest: 'Other' };

function mixbar(d, tot) {
  if (!tot) return '';
  let segs = '';
  for (const [k, lab, col] of MIX) {
    const val = d[k]; if (!val) continue;
    segs += `<i style="width:${(val / tot * 100).toFixed(2)}%;background:${col}"><span>${lab} ${grp(val)} · ${bround(val / tot * 100)}%</span></i>`;
  }
  const under = MIX.filter(([k]) => MIXNAME[k] && d[k]).map(([k]) => `${MIXNAME[k]} ${grp(d[k])}`).join(' · ');
  return `<div class="bar">${segs}</div><div class="bl mixnum">${under || '&nbsp;'}</div>`;
}

function buildNotes(P, rows, ga4Available) {
  const RD = P.reporting_day, N = P.days, notes = [];
  const staff = rows.map(r => [r.v.name, r.v.diag.staff || 0]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
  notes.push('Staff-entered bookings excluded from covers on the reporting day: '
    + (staff.length ? staff.map(([n, c]) => `${n} ${grp(c)}`).join(', ') : 'none')
    + '. These are events and private dining keyed in by the reservations team, not a marketing channel.');

  const hrs = rows.map(r => r.v.diag.distinct_hours || 0).filter(h => h > 0);
  const big = rows.map(r => [r.v.name, r.v.diag.max_booking || 0]).sort((a, b) => b[1] - a[1])[0];
  const svcMin = rows.map(r => r.v.diag.svc_min).filter(Boolean).sort()[0];
  const svcMax = rows.map(r => r.v.diag.svc_max).filter(Boolean).sort().slice(-1)[0];
  if (hrs.length) {
    const lo = Math.min(...hrs), hi = Math.max(...hrs);
    const batchy = lo <= 2 || (big && big[1] >= 100);
    notes.push(`Bulk-import check on ${RD}: creation times spread across ${lo} to ${hi} distinct hours per venue, `
      + `and the largest single booking was ${grp(big[1])} covers at ${esc(big[0])}. `
      + (svcMin && svcMax ? `Service dates run ${longDate(svcMin)} to ${longDate(svcMax)}. ` : '')
      + (batchy
        ? 'That pattern is consistent with a batch load. Check before trusting the day.'
        : 'No batch signature at any venue, so nothing was excluded.'));
  }

  const bdays = [];
  for (const k of [7, 14, 21, 28]) bdays.push(P.dates[N - 1 - k]);
  const hitHol = (P.holidays || []).filter(h => bdays.includes(h.d));
  if (hitHol.length) {
    notes.push(`The ${dlabel(RD).slice(0, 3)}day baseline for this run includes `
      + hitHol.map(h => `${longDate(h.d)} (${esc(h.name)})`).join(' and ')
      + ', a UK bank holiday, which drags the weekday median down. Variances are if anything understated.');
  }

  notes.push('GA4 daily figures settle upward for two to three days, so the GA4 bookings line '
    + 'understates the reporting day by roughly 10 points against baseline.');
  if (RD < '2026-09-18') {
    notes.push('Aqua Shard raw Booking Widget still carries the 21 August landing-page re-tag break. '
      + 'Alerts run on Website covers, which is unaffected. The 28-day baseline clears that boundary on 18 September 2026.');
  }
  if (!ga4Available) {
    notes.push('GA4 has not been written for the reporting day, so GA4 bookings and site users read as '
      + 'unavailable rather than zero, and no GA4 alert was evaluated.');
  }
  return notes;
}

function render(P) {
  const D = P.dates, N = P.days, RD = P.reporting_day, i0 = N - 1;
  const SUPP = P.suppressed || {};
  const ga4Available = !!(P.ga4_through && P.ga4_through >= RD);

  const rows = P.venues.map(v => {
    const suppSet = new Set(SUPP[v.name] || []);
    const a = {};
    for (const [k, lab] of SERIES) {
      a[lab] = assess(v[k], lab, suppSet, D, N, lab === 'GA4 bookings' ? ga4Available : true);
    }
    const m = mixAlert(v, suppSet, D, N);
    const cand = Object.values(a).map(x => x.status).concat([m.status]);
    const worst = cand.reduce((acc, s) => RANK[s] > RANK[acc] ? s : acc, 'green');
    return { v, a, mix: m, status: worst };
  });

  const TOT = {};
  for (const k of ['covers', 'web', 'walk', 'gr', 'ot', 'recep', 'other', 'bookings', 'users']) {
    TOT[k] = []; for (let i = 0; i < N; i++) TOT[k].push(P.venues.reduce((s, v) => s + v[k][i], 0));
  }
  const TCOV = TOT.covers[i0], TWEB = TOT.web[i0], TBK = TOT.bookings[i0], TWALK = TOT.walk[i0];
  const BCOV = baseline(TOT.covers, i0), BWEB = baseline(TOT.web, i0),
        BBK = baseline(TOT.bookings, i0), BWALK = baseline(TOT.walk, i0);

  // ---- alert strip
  const PORT = [];
  const portSeries = [['covers created', TCOV, BCOV]];
  if (ga4Available) portSeries.push(['GA4 bookings', TBK, BBK]);
  for (const [lab, cur, base] of portSeries) {
    if (base && cur < base * (1 - BAND)) {
      PORT.push(`<b>London portfolio ${lab}</b> ${grp(cur)} against a weekday baseline of ${fmt(base)}, ${bround(pctOf(cur, base))}%`);
    }
  }
  const flagged = rows.filter(r => ALERTING.has(r.status)).sort((a, b) => RANK[b.status] - RANK[a.status]);
  let STRIP;
  if (flagged.length || PORT.length) {
    let items = PORT.map(x => `<li>${alertchip('amber', 'PORTFOLIO')} ${x}</li>`).join('');
    for (const r of flagged) {
      const bits = [];
      for (const [, lab] of SERIES) {
        const a = r.a[lab];
        if (!ALERTING.has(a.status)) continue;
        const why = (a.cliff && a.run < 3) ? 'single day under half baseline' : `${a.run} days below band`;
        bits.push(`<b>${SHORT[lab]}</b> ${why} (${fmt(a.value)} against a ${fmt(a.base)} baseline)`);
      }
      if (ALERTING.has(r.mix.status)) {
        bits.push(`<b>channel shift</b> website share ${bround(r.mix.share)}% against a ${bround(r.mix.base)}% baseline, ${r.mix.run} days`);
      }
      items += `<li>${alertchip(r.status)} <b>${esc(r.v.name)}</b> — ${bits.join('; ')}</li>`;
    }
    STRIP = `<div class="alerts"><ul>${items}</ul></div>`;
  } else {
    STRIP = '<div class="clean">No venue outside its band.</div>';
  }

  const WATCH = [];
  for (const r of rows) for (const [, lab] of SERIES) if (r.a[lab].status === 'blue') WATCH.push(`${r.v.name} ${SHORT[lab]}`);
  const WATCHTXT = WATCH.length
    ? `<div class="watch">One day into a run, so a repeat today turns these amber: <b>${esc(WATCH.join(', '))}</b>.</div>` : '';

  // ---- venue table
  let trows = '';
  for (const r of rows) {
    const v = r.v, i = i0;
    const d = { web: v.web[i], walk: v.walk[i], gr: v.gr[i], ot: v.ot[i], rest: v.recep[i] + v.other[i] };
    const cov = v.covers[i], bk = v.bookings[i], us = v.users[i];
    const runs = SERIES.filter(([, lab]) => r.a[lab].run).map(([, lab]) => SHORT[lab].replace(' bookings', ''));
    const nrun = Math.max(0, ...SERIES.map(([, lab]) => r.a[lab].run));
    const why = runs.length
      ? `<div class="why">${runs.join(', ')} · ${nrun} day${nrun !== 1 ? 's' : ''} below band</div>`
      : '<div class="why">inside band</div>';
    trows += `<tr><td class="vn">${esc(v.name)}<div class="bl">${(ga4Available && us) ? (bk / us * 100).toFixed(1) + '% conversion' : '&nbsp;'}</div></td>`
      + numcell(cov, r.a['Covers'].base, true)
      + (ga4Available ? numcell(bk, r.a['GA4 bookings'].base) : '<td class="n"><span class="big">–</span><div class="bl">not written</div></td>')
      + numcell(d.web, r.a['Website'].base)
      + numcell(d.walk, baseline(v.walk, i))
      + `<td class="mixcell">${mixbar(d, cov)}</td>`
      + `<td class="st">${alertchip(r.status)}${why}</td></tr>`;
  }
  const dT = { web: TWEB, walk: TWALK, gr: TOT.gr[i0], ot: TOT.ot[i0], rest: TOT.recep[i0] + TOT.other[i0] };
  trows += `<tr class="total"><td class="vn">London portfolio<div class="bl">${P.venues.length} venues</div></td>`
    + numcell(TCOV, BCOV, true)
    + (ga4Available ? numcell(TBK, BBK) : '<td class="n"><span class="big">–</span><div class="bl">not written</div></td>')
    + numcell(TWEB, BWEB) + numcell(TWALK, BWALK)
    + `<td class="mixcell">${mixbar(dT, TCOV)}</td><td class="st"></td></tr>`;

  const MIXLEG = MIX.map(([, l, c]) => `<span><i style="background:${c}"></i>${l}</span>`).join('');

  // ---- 7-day panels
  let panels = '';
  for (const r of rows) {
    const v = r.v;
    let cards = '';
    for (const [key, lab] of SERIES) {
      if (lab === 'GA4 bookings' && !ga4Available) {
        cards += `<div><div class="pl">${lab}</div><div class="bl" style="padding:20px 0">not written for this day</div></div>`;
        continue;
      }
      const a = r.a[lab];
      const tag = a.run ? `<span class="runtag">${a.run}d below</span>` : '';
      cards += `<div><div class="pl">${lab} ${tag}</div>${spark(v[key], lab, D, N, RD)}</div>`;
    }
    panels += `<div class="panel"><div class="pt">${esc(v.name)} ${alertchip(r.status)}</div><div class="pg">${cards}</div></div>`;
  }

  const NOTES = buildNotes(P, rows, ga4Available).map(n => `<li>${n}</li>`).join('');
  const SUPPTXT = Object.keys(SUPP).length
    ? Object.entries(SUPP).map(([k, vv]) => `${esc(k)}: ${vv.join(', ')}`).join('; ') : 'none';

  const kpi = (lab, val, base, extra) =>
    `<div class="kpi"><div class="lab">${lab}</div><div class="big">${val === null ? '–' : grp(val)}</div>`
    + `<div class="meta">${val === null ? 'not written for this day' : `baseline ${fmt(base)} · ${chip(pctOf(val, base))}${extra || ''}`}</div></div>`;

  document.getElementById('sub').innerHTML =
    `${RD} · covers by booking-created date · Europe/London`;

  document.getElementById('app').innerHTML = `
${STRIP}
${WATCHTXT}
<div class="cards">
${kpi('Covers created', TCOV, BCOV, '')}
${kpi('Website covers', TWEB, BWEB, ` · ${bround(TWEB / TCOV * 100)}% of covers`)}
${kpi('Walk-ins', TWALK, BWALK, ` · ${bround(TWALK / TCOV * 100)}% of covers`)}
${kpi('GA4 bookings', ga4Available ? TBK : null, BBK, '')}
</div>

<div class="sec">Yesterday by venue — ${RD}</div>
<div class="mixleg">${MIXLEG}<span style="color:#a8b3c2">hover a bar segment for its numbers</span></div>
<table><thead><tr>
<th>Venue</th><th>Covers created</th><th>GA4 bookings</th><th>Website covers</th>
<th>Walk-ins</th><th>Channel mix</th><th>Status</th></tr></thead>
<tbody>${trows}</tbody></table>
<div class="sub" style="margin-top:10px;font-size:12px">Every figure is compared with the median of the same weekday over the four preceding weeks, shown beneath it. Status counts consecutive days below the band ending on ${RD}: three or more is red, two is amber, one is a watch. Walk-ins are shown but never alerted on, being footfall rather than a channel we run.</div>

<div class="sec">Seven days to ${RD} — variance against the weekday baseline</div>
<div class="legend">
<span><i class="lg-line"></i>variance against the weekday baseline</span>
<span><i class="lg-base"></i>baseline, 0%</span>
<span><i class="lg-band"></i>band, ±20%</span>
<span><i class="lg-dot"></i>day below the band</span>
<span><i class="lg-off"></i>beyond ±50%, clamped to the edge</span>
<span style="color:#94a3b8">every chart is on the same ±50% scale · hover any point for the raw numbers</span>
</div>
<div class="panels">${panels}</div>

<footer>
<b>Method.</b> Covers = SUM(covers) from SevenRooms via Supabase, bucketed by booking-created date in Europe/London, excluding deleted and cancelled bookings and bar seating areas. Staff-name booking sources are excluded from covers entirely. Website = Booking Widget plus all landing pages, Nav and Hero CTAs, the menu page, PPC and campaign tags. GA4 bookings = event sevenrooms_booking_complete. Regent St combines Aqua Kyoto and Aqua Nueva.
<ul>
<li>Baseline for each day is the median of that same weekday across the four preceding weeks. Band is baseline plus or minus 20 percent. Red is three or more consecutive days below the band, or a single day under half baseline. Amber is two consecutive days. The run resets the moment a day lands back inside the band.</li>
<li>Alerts run on Website covers, not on the raw Booking Widget source. Aqua Shard re-tagged widget traffic into named landing pages on 21 Aug 2026, so the raw widget series has a definition break there. The widget series is carried in the data but not shown: it measures how a booking was tagged rather than anything actionable.</li>
<li>Google conversions and GA4 channel data are deliberately absent: both settle over two to three days and cannot be read on a daily cadence.</li>
<li>Covers re-settle downward as cancellations accrue, so this page recomputes the whole window from SevenRooms on every load rather than reading a stored figure.</li>
<li>Suppressed dates (closures and known buyouts): ${SUPPTXT}.</li>
${NOTES}
</ul>
Covers read live through ${P.covers_through}, refreshed four times an hour. GA4 written through ${P.ga4_through || 'never'}${P.ga4_updated ? ', last at ' + new Date(P.ga4_updated).toISOString().replace('T', ' ').slice(0, 16) + ' UTC' : ''}. Page rendered ${new Date().toISOString().replace('T', ' ').slice(0, 16)} UTC.
</footer>`;

  // freshness / staleness
  const expected = shiftDay(P.today_london, -1);
  const f = document.getElementById('freshness');
  if (RD < expected) {
    f.innerHTML = `<span style="color:#b45309">showing ${RD}; yesterday was ${expected}</span>`;
  } else {
    f.innerHTML = `<span style="color:#16a34a">live</span>`;
  }
  if (!ga4Available) {
    document.getElementById('app').insertAdjacentHTML('afterbegin',
      `<div class="stale"><b>GA4 has not been written for ${RD}.</b> Covers are live and complete. `
      + `GA4 bookings and site users are shown as unavailable rather than zero, and no GA4 alert was `
      + `evaluated, so this page cannot raise a false red on a missing feed. Last GA4 day written: ${P.ga4_through || 'none'}.</div>`);
  }
}

// ---------------------------------------------------------------- load
let CURRENT = null, BOUNDS = null;

async function load(d) {
  const app = document.getElementById('app');
  app.innerHTML = '<div class="load">Loading live figures…</div>';
  const qs = d ? `?d=${encodeURIComponent(d)}` : '';
  try {
    const res = await fetch(`/.netlify/functions/london-daily${qs}`, { headers: { accept: 'application/json' } });
    const P = await res.json();
    if (!res.ok || P.error) throw new Error(P.error || `HTTP ${res.status}`);
    CURRENT = P.reporting_day;
    BOUNDS = { from: P.covers_from, to: shiftDay(P.today_london, -1) };
    const pick = document.getElementById('dpick');
    pick.value = P.reporting_day;
    // 28 days of baseline are needed before the first reportable day
    pick.min = shiftDay(P.covers_from, 28);
    pick.max = BOUNDS.to;
    render(P);
  } catch (e) {
    app.innerHTML = `<div class="err"><b>Could not load the live figures.</b> ${esc(String(e.message || e))}<br>`
      + `Nothing is shown rather than a stale or partial number. Try again, or check the Supabase connection and the `
      + `SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY variables on the Netlify site.</div>`;
    document.getElementById('freshness').innerHTML = '<span style="color:#dc2626">load failed</span>';
  }
}

document.getElementById('dpick').addEventListener('change', e => { if (e.target.value) load(e.target.value); });
document.getElementById('prev').addEventListener('click', () => { if (CURRENT) load(shiftDay(CURRENT, -1)); });
document.getElementById('next').addEventListener('click', () => {
  if (!CURRENT) return;
  const n = shiftDay(CURRENT, 1);
  if (!BOUNDS || n <= BOUNDS.to) load(n);
});
document.getElementById('latest').addEventListener('click', () => load(null));

load(new URLSearchParams(location.search).get('d'));
</script>
</body></html>
