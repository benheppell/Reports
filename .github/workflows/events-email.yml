# Emails the London events report as a PDF (with the team conversion table) after the morning
# Tripleseat pull: last week every Monday, last month on the 1st. Sent from the work Outlook mailbox
# through Microsoft Graph (an Entra ID app with Mail.Send); sender, app keys and recipients are GitHub
# secrets. This repo is public: the PDF is never uploaded as an artifact.
name: Events report email

on:
  schedule:
    - cron: "37 7 * * 1"   # Mondays: last ISO week
    - cron: "47 7 1 * *"   # 1st of the month: last month
  workflow_dispatch:
    inputs:
      period:
        description: "month or week"
        default: month
      date:
        description: "any date in the period (blank = last complete one)"
        default: ""
      send:
        description: "send the email (false = render only)"
        default: "false"
      test:
        description: "true = send only to the sending mailbox (a test), false = the full recipient list"
        default: "true"

concurrency:
  group: events-email-${{ github.event.schedule || github.event.inputs.period }}
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
      EVENTS_REPORT_FROM: ${{ secrets.EVENTS_REPORT_FROM }}
      EVENTS_REPORT_TO: ${{ secrets.EVENTS_REPORT_TO }}
      PERIOD: ${{ github.event.inputs.period || (github.event.schedule == '47 7 1 * *' && 'month') || 'week' }}
      ON_DATE: ${{ github.event.inputs.date }}
      SEND: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.send }}
      TEST: ${{ github.event_name != 'schedule' && github.event.inputs.test || 'false' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aqua/requirements.txt
      - run: pip install -r aqua/requirements.txt playwright==1.48.0
      - run: python -m playwright install --with-deps chromium
      - name: Render and send
        run: |
          args="--period $PERIOD"
          [ -n "$ON_DATE" ] && args="$args --date $ON_DATE"
          [ "$SEND" = "true" ] && args="$args --send"
          [ "$TEST" = "true" ] && args="$args --test"
          python -m aqua.jobs.events_email $args
