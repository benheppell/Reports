# Tripleseat, weekly full re-pull: every event created in the trailing 455 days (65 weeks), so last year's
# comparison stays right as old prospects are lost or closed. Sunday night, after the week closes.
# Run it by hand with mode "check" to repeat the discovery cross-checks without writing anything.
name: Tripleseat weekly

on:
  schedule:
    - cron: "17 22 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "check, discover, daily, weekly or backfill"
        default: check
      account:
        description: "london or paris"
        default: london
      range:
        description: "backfill only: START END_EXCL, e.g. 2025-02-01 2027-02-01"
        default: "2025-02-01 2027-02-01"

concurrency:
  group: tripleseat
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # Paris is a separate Tripleseat account with its own keys.
      TRIPLESEAT_CLIENT_ID: ${{ github.event.inputs.account == 'paris' && secrets.TRIPLESEAT_PARIS_CLIENT_ID || secrets.TRIPLESEAT_CLIENT_ID }}
      TRIPLESEAT_CLIENT_SECRET: ${{ github.event.inputs.account == 'paris' && secrets.TRIPLESEAT_PARIS_CLIENT_SECRET || secrets.TRIPLESEAT_CLIENT_SECRET }}
      MODE: ${{ github.event.inputs.mode || 'weekly' }}
      RANGE: ${{ github.event.inputs.range || '2025-02-01 2027-02-01' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aqua/requirements.txt
      - run: pip install -r aqua/requirements.txt
      - name: Tripleseat
        run: |
          case "$MODE" in
            check)  python -m aqua.jobs.tripleseat --check ;;
            discover) python -m aqua.jobs.tripleseat --discover ;;
            daily)  python -m aqua.jobs.tripleseat --daily --write ;;
            weekly) python -m aqua.jobs.tripleseat --weekly --write ;;
            backfill) python -m aqua.jobs.tripleseat --backfill $RANGE --write ;;
            *) echo "unknown mode $MODE"; exit 1 ;;
          esac
