# Aqua Reports: the one place every market, venue, account and rule lives.
#
# Sources: claude/weekly-reports-runbook.md and claude/booking-pipeline-runbook.md
# (as of 18 Oct and 12 Oct 2026) and the w2026-10-26 payloads. When a venue opens,
# closes or changes account, change it here and nowhere else.
#
# Venue keys
#   name            report row name, as shown on every page
#   sr              SevenRooms venue record name(s) in public.venues; summed
#   sr_from         only count SevenRooms rows created on or after this date
#   ga4             GA4 property id(s); summed, rates session-weighted
#   ga4_path        PARTIAL_REGEXP a pagePath must match (property split)
#   ga4_path_not    PARTIAL_REGEXP a pagePath must not match (property split)
#   meta            Meta ad account id(s)
#   meta_campaigns  only these campaign ids count (shared account)
#   meta_book_campaigns  only these campaign ids count toward Meta bookings
#   meta_event      Meta action_type that counts as a booking
#   google          Google Ads customer id
#   google_mgr      manager (MCC) id to log in as, if managed
#   google_actions  conversion action names that count, overriding the default rule
#   google_excluded true: show spend as n/a, keep it out of CPA and paid funnel
#   gsc_site / gsc_regex   Search Console property and brand query regex
#   shared_ads      ad accounts shared with another row: never divide, show once
#   outside         below the portfolio line, out of every total
#   not_comparable  YoY shown as n/c
#   no_ly           new venue, no last year
#   pill            short tag shown beside the name

[defaults]
meta_event = "schedule_total"
# Google bookings: actions whose name contains "booking" and "complete" and not "ga4".
google_rule = "booking_complete_not_ga4"
ga4_event = "sevenrooms_booking_complete"
ga4_exclude_paths = "modify|manage|prearrival"     # create path only, from 12 Oct 2026
late_record_rule = true                              # service date before created-week Monday is dropped, from 16 Oct 2026
yoy_offset_days = 364
flat_band_pct = 1.5

